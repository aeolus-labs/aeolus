version: 2

# Build the embedded React dashboard before cross-compiling the Go binary.
# Without this, `go build` would embed an empty internal/dashboard/web.
before:
  hooks:
    - sh -c "cd dashboard && npm ci --no-fund --no-audit"
    - sh -c "cd dashboard && npm run build"

builds:
  - id: aeolus
    main: ./cmd/aeolus
    binary: aeolus
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: aeolus
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Releases land as drafts. They stay invisible to the public until someone
# manually clicks Publish in the GitHub UI. Safe default for the
# "infrastructure built, not launched yet" phase.
release:
  draft: true
  prerelease: auto
  github:
    owner: aeolus-labs
    name: aeolus
  header: |
    ## Aeolus {{.Version}}

    Local gateway for Model Context Protocol (MCP) servers.

    See the [README](https://github.com/aeolus-labs/aeolus#readme) for installation and client setup.
  footer: |
    ---
    Built from commit `{{.ShortCommit}}`.

# Homebrew Cask is generated into a separate aeolus-labs/homebrew-tap
# repo (the `homebrew-` prefix is what makes GitHub recognize it as a
# tap). The release job needs HOMEBREW_TAP_GITHUB_TOKEN set in this
# repository's secrets — a fine-grained PAT with contents:write on the
# tap repo. If the secret isn't set or the tap repo doesn't exist, the
# binaries still publish to the release; only the cask update fails.
#
# Why a Cask instead of a Formula? GoReleaser v2.10 deprecated the
# Formula generator (`brews:`) because Formulas are meant to build from
# source. We're shipping pre-compiled binaries, which Casks model
# honestly. End users still install with `brew install aeolus-labs/tap/aeolus`.
homebrew_casks:
  - name: aeolus
    repository:
      owner: aeolus-labs
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/aeolus-labs/aeolus"
    description: "Local gateway for Model Context Protocol (MCP) servers"
    binaries:
      - aeolus
    # The binary isn't notarized yet, so strip the Gatekeeper quarantine
    # attribute on install. Without this, macOS refuses to execute the
    # binary on first run ("cannot be opened because the developer cannot
    # be verified"). Revisit when we set up Apple Developer ID signing.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/aeolus"]
          end
    caveats: |
      Aeolus is installed. To finish setup:

        aeolus service install   # installs the OS service + starts the daemon
        aeolus open              # opens the dashboard at http://localhost:8765

      On Linux, also enable user lingering so the daemon keeps running
      when you're logged out:

        sudo loginctl enable-linger $USER

      Configure MCP servers via the dashboard, or edit:

        ~/.config/aeolus/aeolus.yaml

      Then point Claude / Cursor / Zed / Copilot at Aeolus — the
      dashboard's "Connect a client" button generates the exact snippet
      for each client.
